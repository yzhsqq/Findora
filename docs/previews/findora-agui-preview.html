    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>

    <symbol id="i-compare" viewBox="0 0 24 24"><path d="M5 4v16m14-16v16M8 8h8m-3-3 3 3-3 3M16 16H8m3-3-3 3 3 3"/></symbol>
  </defs></svg>
  <aside class="sidebar" aria-label="主导航">
    <a class="brand" href="#" id="brand"><svg class="brand-mark"><use href="#i-globe"/></svg><div><div class="brand-name">Globex</div><div class="brand-subtitle">环球好物</div></div></a>
    <button class="new-chat" data-action="new"><svg><use href="#i-plus"/></svg>开启一次新选购</button>
    <nav class="nav"><button class="nav-item active" data-view="shopping"><svg><use href="#i-bag"/></svg>我的选购</button><button class="nav-item" data-view="history"><svg><use href="#i-chat"/></svg>对话历史</button><button class="nav-item" data-view="favorites"><svg><use href="#i-heart"/></svg>心选收藏<span class="nav-count" id="favorite-count">0</span></button></nav>
    <div class="nav-label">最近的灵感</div><button class="history-short" data-action="restore">周末，轻装出发</button><button class="history-short" data-prompt="推荐日常通勤耳机">通勤路上的好声音</button>
    <div class="sidebar-bottom"><div class="sidebar-note"><svg class="little-orbit"><use href="#i-globe"/></svg><p>世界很大，<br>适合你的，刚刚好。</p></div><div class="profile"><div class="avatar">旅</div><div><div class="profile-name">好物探索家</div><div class="profile-caption">每一次选择，都有新发现</div></div><svg><use href="#i-leaf"/></svg></div></div>
  </aside>
  <main><div class="content">
    <header class="topbar"><div class="breadcrumb"><span>我的选购</span><span>／</span><span id="breadcrumb-current">周末，轻装出发</span></div><a class="mobile-brand" href="#" data-action="restore"><svg><use href="#i-globe"/></svg>Globex</a><div class="location"><svg><use href="#i-pin"/></svg>配送至中国 · CNY</div></header>
    <nav class="mobile-nav" style="display:none" aria-label="移动导航"><button data-action="new">新选购</button><button data-view="shopping" class="active">我的选购</button><button data-view="history">历史</button><button data-view="favorites">收藏</button></nav>
    <div id="page"></div>
  </div></main>
  <div class="composer-dock"><div class="composer-wrap"><div id="compare-bar"></div><form class="composer" id="composer"><label for="query" class="sr-only">告诉 Globex 你想寻找的好物</label><textarea id="query" rows="1" maxlength="500" placeholder="再聊聊你的偏好，让选择更接近你…"></textarea><div class="composer-bottom"><span class="composer-hint"><svg><use href="#i-spark"/></svg>告诉我用途、预算，或你在意的小细节</span><button type="submit" class="send-button" id="send-button" aria-label="发送选购需求"><svg><use href="#i-up"/></svg></button></div></form><footer class="preview-footer"><span>交互设计预览 · 演示商品与图片</span><button class="debug-toggle" data-action="debug">查看交互事件</button></footer></div></div>
  <div id="modal-root"></div><div id="toast" class="toast" role="status"></div><div class="sr-only" id="live-status" aria-live="polite" aria-atomic="true"></div>
  <script>
    'use strict';
    /* 本文件仅演示交互。所有事件来自本地脚本，不调用真实商品检索、模型或交易服务。 */
    const icon=(name,cls='')=>`<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const initialQuery='预算300元以内，找一个轻便的周末旅行背包，寄到中国。';
    const products=[
      {id:'P1003',brand:'WANDERLITE',name:'Wanderlite 折叠旅行双肩包',capacity:'35L',price:129,rating:'4.2',reviews:52,colors:'石墨黑 / 雾霾蓝',swatches:['#555957','#879ca4'],image:'assets/wanderlite.png',badge:'轻装旅行之选',caption:'PACK LIGHT, GO FAR',subtitle:'35L 容量 · 可折叠收纳',description:'如果希望旅行包用完后也好收纳，可以先看看这款折叠双肩包。35L 是这三款中容量较大的选择。',purpose:'旅行与折叠收纳'},
      {id:'P1018',brand:'DRYPACK',name:'DryPack 防水卷口背包',capacity:'30L',price:219,rating:'4.8',reviews:217,colors:'墨绿',swatches:['#465d44'],image:'assets/drypack.png',badge:'在意防水，看看它',caption:'A LITTLE MORE ADVENTURE',subtitle:'30L 容量 · 防水卷口设计',description:'更在意防水结构的话，可以关注这款卷口背包。防水等级、具体材质与使用限制，仍需在购买前核对商品详情。',purpose:'卷口设计与防水需求'},
      {id:'P1049',brand:'BUDGETPACK',name:'BudgetPack 简易背包',capacity:'20L',price:39,rating:'4.0',reviews:327,colors:'黑色',swatches:['#3c4140'],image:'assets/budgetpack.png',badge:'更轻松的预算',caption:'LESS BAG, MORE WEEKEND',subtitle:'20L 容量 · 简单日常款',description:'短途只带少量随身物品，可以从 20L 的简易背包开始。价格较低，适合把预算留给旅程本身。',purpose:'少量随身物品与低预算'}
    ];
    const defaultAnswer='这 3 款都在你的预算内。如果想轻便收纳，先看 Wanderlite；更在意防水，看看 DryPack；只装少量随身物品，BudgetPack 就是更省预算的选择。';
    let serial=0;
    const makeId=prefix=>`${prefix}_demo_${Date.now().toString(36)}_${++serial}`;
    const state={view:'shopping',query:initialQuery,answer:defaultAnswer,productIds:products.map(p=>p.id),stage:'完成选购建议',running:false,finished:true,mode:'backpack',favorites:new Set(),compare:new Set(),events:[],threadId:makeId('thread'),runId:null,messageId:null,activeTool:null,toolArgs:'',toolResults:[],steps:[],stopped:false,newSession:false};
    let abortController=null,toastTimer=null,focusBeforeModal=null;
    const page=document.getElementById('page'),modalRoot=document.getElementById('modal-root'),queryInput=document.getElementById('query');

    /* 用协议形状的事件驱动状态，再统一渲染。可替换为真实事件适配器的边界。 */
    function reduceEvent(current,event){
      switch(event.type){
        case 'RUN_STARTED':current.running=true;current.finished=false;current.stopped=false;current.threadId=event.threadId;current.runId=event.runId;current.answer='';current.productIds=[];current.steps=[];current.stage='正在整理你的需求';break;
        case 'STEP_STARTED':current.stage=event.stepName;break;
        case 'STEP_FINISHED':current.steps.push(event.stepName);break;
        case 'TOOL_CALL_START':current.activeTool=event.toolCallId;current.toolArgs='';break;
        case 'TOOL_CALL_ARGS':current.toolArgs+=event.delta;break;
        case 'TOOL_CALL_END':current.activeTool=null;break;
        case 'TOOL_CALL_RESULT':current.toolResults.push({toolCallId:event.toolCallId,content:event.content});break;
        case 'TEXT_MESSAGE_START':current.messageId=event.messageId;current.answer='';break;
        case 'TEXT_MESSAGE_CONTENT':if(event.messageId===current.messageId)current.answer+=event.delta;break;
        case 'TEXT_MESSAGE_END':break;
        case 'STATE_SNAPSHOT':Object.assign(current,event.snapshot);break;
        case 'STATE_DELTA':for(const patch of event.delta){if(patch.op==='replace'&&['/productIds','/stage','/mode'].includes(patch.path))current[patch.path.slice(1)]=patch.value;}break;
        case 'RUN_FINISHED':current.running=false;current.finished=true;current.stage='完成选购建议';break;
        case 'RUN_ERROR':current.running=false;current.finished=false;current.stage='预览暂时中断';break;
        case 'CUSTOM':if(event.name==='demo.run_cancelled'){current.running=false;current.stopped=true;current.stage=current.productIds.length?'已停止，已找到的商品已保留':'已停止';if(!current.answer)current.answer='本轮已停止。准备好后，我们可以继续挑选。';}break;
      }
      return current;
    }
    function emit(event){const envelope={...event,timestamp:Date.now()};state.events.push(envelope);if(state.events.length>160)state.events.shift();reduceEvent(state,envelope);if(event.type==='TEXT_MESSAGE_CONTENT'&&state.view==='shopping'){const answer=document.getElementById('assistant-answer');if(answer)answer.textContent=state.answer;}else if(event.type!=='TOOL_CALL_ARGS'){render();}if(!['TEXT_MESSAGE_CONTENT','TOOL_CALL_ARGS'].includes(event.type))document.getElementById('live-status').textContent=state.stage;}
    function productById(id){return products.find(p=>p.id===id)}
    function card(product,index=0){const saved=state.favorites.has(product.id),selected=state.compare.has(product.id);return `<article class="product-card ${selected?'selected':''}" style="animation-delay:${index*50}ms" data-product="${product.id}"><div class="product-visual"><button class="image-open" data-detail="${product.id}" aria-label="查看 ${escapeHtml(product.name)} 详情"><img src="${product.image}" alt="${escapeHtml(product.name)} ${product.capacity} 演示图片" loading="eager"></button><span class="product-badge">${product.badge}</span><button class="heart ${saved?'saved':''}" data-favorite="${product.id}" aria-label="${saved?'取消收藏':'收藏'} ${escapeHtml(product.name)}" aria-pressed="${saved}">${icon('heart')}</button><span class="visual-caption">${product.caption}</span></div><div class="product-body"><div class="product-topline"><span>${product.brand}</span><span class="rating"><i>★</i> ${product.rating} <span>(${product.reviews} · 样例)</span></span></div><button class="product-title" data-detail="${product.id}">${product.name.replace(product.name.split(' ')[0]+' ','')}</button><div class="product-subtitle">${product.subtitle}</div><div class="product-price-row"><div class="price"><small>¥</small>${product.price}</div><div class="color-swatches" aria-label="${product.colors}">${product.swatches.map(color=>`<span class="swatch" style="background:${color}"></span>`).join('')}</div></div><div class="product-footer"><label class="compare-check"><input type="checkbox" data-compare="${product.id}" ${selected?'checked':''} aria-label="将 ${escapeHtml(product.name)} 加入比较">加入比较</label><button class="detail-button" data-detail="${product.id}">看看细节${icon('arrow')}</button></div></div></article>`}
    function progress(){if(state.running||state.stopped)return `<div class="progress-line ${state.running?'running':''}"><span class="live-dot"></span><span>${escapeHtml(state.stage)}</span></div>`;if(state.mode!=='backpack')return `<div class="progress-line"><span class="live-dot"></span><span>需求已收到 · 这是有限商品的交互演示</span></div>`;return `<div class="progress-line"><span class="progress-item">${icon('check')}已找到 ${state.productIds.length} 件好物</span><span class="progress-divider"></span><span class="progress-item">${icon('check')}商品价符合预算</span><span class="progress-divider"></span><span class="progress-item">${icon('check')}支持配送中国</span></div>`}
    function emptyResult(){let title='这次，还没有合适的结果',message='演示商品中没有符合这组条件的背包。放宽预算，或换一种需求再看看。';if(state.mode==='headphone'){title='好声音，留给下一次探索';message='这个预览暂未配置耳机商品。你可以体验背包选购、收藏、商品对比和中途停止。';}if(state.mode==='unsupported'){title='这份需求先记下了';message='这份预览支持背包选购与无结果演示，暂不进行真实全品类搜索。试试“预算 300 元的周末背包”。';}if(state.stopped){title='先停在这里，也没关系';message='本轮演示已停止，尚未产生商品结果。你可以调整需求，准备好后再开始。';}return `<div class="empty-state">${icon(state.mode==='headphone'?'spark':'bag')}<h2>${title}</h2><p>${message}</p><button data-prompt="${initialQuery}">看看周末背包${icon('arrow')}</button></div>`}
    function renderShopping(){if(state.newSession)return `<section class="hero"><div class="eyebrow">CURATED FOR YOUR EVERYDAY</div><h1>新的期待，<br>从一个好问题开始。</h1><p>慢慢说，我来把选择变简单。</p></section><section class="welcome-panel">${icon('globe','welcome-orbit')}<h2>下一件好物，你想找什么？</h2><p>先从一个用途、一段旅程，或一个小偏好聊起。</p><div class="welcome-ideas"><button data-prompt="${initialQuery}">周末出游，轻便背包</button><button data-prompt="预算 100 元以内的背包">预算 100 元以内</button><button data-prompt="预算 20 元以内的背包">试试无结果场景</button></div></section>`;return `<section class="hero"><div class="eyebrow">A LITTLE LESS, A LITTLE BETTER</div><h1>为下一次出发，<em>选得刚刚好。</em></h1><p>说说你的期待。世界各地的好物，我陪你慢慢选。</p></section><div class="query-row"><div class="query-bubble">${escapeHtml(state.query)}${icon('check')}</div></div>${progress()}<div class="assistant-row"><div class="assistant-mark">${icon('spark')}</div><div class="assistant-text ${state.running?'typing':''}" id="assistant-answer">${escapeHtml(state.answer||'正在把你的期待，整理成更清楚的选择。')}</div></div><div class="results-heading"><div class="results-label"><strong>${state.mode==='backpack'?'为你的周末挑选':'选购结果'}</strong>${state.productIds.length?` · ${state.productIds.length} 件` : ''}</div><button class="results-action" data-action="compare-hint">${icon('compare')}勾选商品，轻松对比</button></div><div class="product-grid">${state.productIds.map((id,index)=>card(productById(id),index)).join('')}${state.running&&state.productIds.length===0?'<div class="loading-card" aria-label="正在寻找商品"></div><div class="loading-card" aria-hidden="true"></div><div class="loading-card" aria-hidden="true"></div>':''}${!state.running&&!state.productIds.length?emptyResult():''}</div>${state.productIds.length?`<div class="results-footnote">${icon('info')}展示为商品价；到手价待目的地与规格确认。评分与评价数量为样例。</div>`:''}<div class="suggestions"><button class="suggestion" data-prompt="预算 100 元以内的背包">预算再少一点${icon('arrow')}</button><button class="suggestion" data-prompt="帮我比较这几款背包">帮我比较这几款${icon('arrow')}</button><button class="suggestion" data-prompt="推荐日常通勤耳机">再看看通勤耳机${icon('arrow')}</button></div>`}
    function renderFavorites(){const items=products.filter(p=>state.favorites.has(p.id));return `<h1 class="library-title">心动的，先留在这里。</h1><p class="library-description">不急着做决定。${items.length?'这 '+items.length+' 件好物，随时回来再看看。':'把喜欢的商品收好，让下一次选择更从容。'}</p><div class="product-grid">${items.length?items.map(card).join(''):`<div class="empty-state">${icon('heart')}<h2>你的好物清单，等待第一份心动</h2><p>点击商品右上角的爱心，就能把它留在这里。</p><button data-action="restore">去发现好物${icon('arrow')}</button></div>`}</div>`}
    function renderHistory(){return `<h1 class="library-title">每一次期待，都有迹可循。</h1><p class="library-description">从上次聊到的地方，继续发现。以下为本次预览的示例对话。</p><div class="history-list"><button class="history-entry" data-action="restore"><span class="history-icon">${icon('bag')}</span><span><strong>周末，轻装出发</strong><small>预算 300 元 · 3 款旅行背包 · 配送中国</small></span>${icon('arrow')}</button><button class="history-entry" data-prompt="推荐日常通勤耳机"><span class="history-icon">${icon('spark')}</span><span><strong>通勤路上的好声音</strong><small>耳机选购 · 暂未配置商品的演示场景</small></span>${icon('arrow')}</button></div>`}
    function render(){const scrollY=window.scrollY;page.innerHTML=state.view==='history'?renderHistory():state.view==='favorites'?renderFavorites():renderShopping();document.querySelectorAll('[data-view]').forEach(button=>button.classList.toggle('active',button.dataset.view===state.view));document.getElementById('favorite-count').textContent=state.favorites.size;document.getElementById('breadcrumb-current').textContent=state.view==='favorites'?'心选收藏':state.view==='history'?'对话历史':state.newSession?'新的选购':'周末，轻装出发';const send=document.getElementById('send-button');send.className='send-button'+(state.running?' stop':'');send.innerHTML=state.running?`${icon('stop')}<span>停止</span>`:icon('up');send.setAttribute('aria-label',state.running?'停止生成':'发送选购需求');const compared=[...state.compare].map(productById);document.getElementById('compare-bar').innerHTML=compared.length?`<div class="compare-bar"><div class="compare-mini">${compared.map(p=>`<img src="${p.image}" alt="">`).join('')}</div><span>已选 ${compared.length} 件${compared.length===1?'，再选一件比比看':''}</span><button class="compare-go" data-action="open-compare" ${compared.length<2?'disabled':''}>开始比较${icon('arrow')}</button><button class="compare-clear" data-action="clear-compare">清空</button></div>`:'';window.scrollTo({top:scrollY,behavior:'instant'});}
    function toast(message){const node=document.getElementById('toast');node.textContent=message;node.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('visible'),2300);}
    function navigate(view){state.view=view;render();window.scrollTo({top:0,behavior:'smooth'});}
    function updateFavorite(id){if(state.favorites.has(id)){state.favorites.delete(id);toast('已从心选收藏移除');}else{state.favorites.add(id);toast('已收好，喜欢的可以慢慢选。');}render();}
    function updateCompare(id){if(state.compare.has(id))state.compare.delete(id);else state.compare.add(id);render();}
    function openModal(html,kind='modal'){focusBeforeModal=document.activeElement;modalRoot.innerHTML=`<div class="overlay" data-overlay="true"><section class="${kind}" role="dialog" aria-modal="true" aria-label="${kind==='drawer'?'商品详情':'选购预览面板'}"><button class="close-modal" data-action="close-modal" aria-label="关闭">${icon('close')}</button>${html}</section></div>`;document.body.style.overflow='hidden';modalRoot.querySelector('.close-modal').focus();}
    function closeModal(){modalRoot.innerHTML='';document.body.style.overflow='';if(focusBeforeModal?.isConnected)focusBeforeModal.focus();else queryInput.focus();}
    function openDetail(id){const p=productById(id);openModal(`<div class="drawer-visual"><img src="${p.image}" alt="${escapeHtml(p.name)}演示图片"><span class="visual-caption">${p.caption}</span></div><div class="drawer-kicker">${p.brand} · ${p.id}</div><h2>${p.name.replace(p.name.split(' ')[0]+' ','')}</h2><p class="drawer-description">${p.description}</p><div class="price"><small>¥</small>${p.price}</div><div class="detail-specs"><div><span>容量</span><span>${p.capacity}</span></div><div><span>可选颜色</span><span>${p.colors}</span></div><div><span>评分样例</span><span>★ ${p.rating} / 5 · ${p.reviews} 条</span></div><div><span>配送目的地</span><span>中国</span></div></div><p class="drawer-note">到手价待目的地与规格确认。此处为商品展示与交互设计预览，不提供实际购买、库存或到货承诺。</p><button class="primary-button" data-drawer-compare="${p.id}">${icon('compare')}${state.compare.has(p.id)?'已加入比较，返回看看':'加入比较，慢慢挑选'}</button>`,'drawer');}
    function openCompare(){const items=[...state.compare].map(productById);if(items.length<2){toast('先勾选两件商品，就能放在一起比较。');return;}openModal(`<h2>放在一起，选择更清楚。</h2><p class="modal-intro">关注你在意的不同，也给决定留一点空间。</p><table class="compare-table"><thead><tr><th>你的心选</th>${items.map(p=>`<th><img src="${p.image}" alt="${escapeHtml(p.name)}"><strong>${p.name}</strong></th>`).join('')}</tr></thead><tbody><tr><td>商品价</td>${items.map(p=>`<td><span class="price"><small>¥</small>${p.price}</span></td>`).join('')}</tr><tr><td>容量</td>${items.map(p=>`<td>${p.capacity}</td>`).join('')}</tr><tr><td>设计侧重</td>${items.map(p=>`<td>${p.purpose}</td>`).join('')}</tr><tr><td>颜色</td>${items.map(p=>`<td>${p.colors}</td>`).join('')}</tr><tr><td>评分样例</td>${items.map(p=>`<td>★ ${p.rating}（${p.reviews} 条）</td>`).join('')}</tr></tbody></table><p class="drawer-note" style="margin-top:20px">以上为演示目录信息。到手价待目的地与规格确认；未提供的数据不参与比较。</p>`);}
    function openDebug(){openModal(`<h2>交互事件预览</h2><p class="modal-intro">以下是本地演示脚本产生的 AG-UI 形状事件，由页面 reducer 消费。未接入真实 AG-UI 服务、模型、检索或交易。展示可见步骤与结果，不展示模型隐式推理。停止操作使用自定义取消事件。</p><pre>${escapeHtml(state.events.map(event=>JSON.stringify(event)).join('\n')||'尚无事件。发送一次背包需求，即可查看流式演示。')}</pre>`,'modal debug-modal');}
    function stopRun(){if(!state.running)return;abortController?.abort();emit({type:'CUSTOM',name:'demo.run_cancelled',value:{threadId:state.threadId,runId:state.runId,reason:'user_requested'}});toast(state.productIds.length?'已停止，找到的结果会为你保留。':'本轮已停止，尚未产生商品结果。');}
    function restore(){if(state.running)stopRun();state.view='shopping';state.newSession=false;state.query=initialQuery;state.answer=defaultAnswer;state.productIds=products.map(p=>p.id);state.mode='backpack';state.finished=true;state.stopped=false;state.stage='完成选购建议';render();window.scrollTo({top:0,behavior:'smooth'});}
    const pause=(ms,signal)=>new Promise((resolve,reject)=>{if(signal.aborted){reject(new DOMException('Aborted','AbortError'));return;}const timer=setTimeout(()=>{signal.removeEventListener('abort',onAbort);resolve();},ms);function onAbort(){clearTimeout(timer);reject(new DOMException('Aborted','AbortError'));}signal.addEventListener('abort',onAbort,{once:true});});
    function scenario(query){if(/比较|对比/.test(query))return{compare:true};if(/耳机|耳塞|通勤声音/.test(query))return{mode:'headphone',items:[],answer:'耳机也值得好好挑选。不过，这份交互预览只配备了 3 款背包演示数据，目前没有耳机商品结果。你可以换成背包，体验完整的比较与收藏流程。'};if(!/背包|双肩|旅行包|无结果/.test(query))return{mode:'unsupported',items:[],answer:'我收到你的新需求了。这份预览只模拟背包选购，不会把预置商品当作你的真实搜索结果。试试“预算 300 元以内的周末背包”，或体验一个无结果场景。'};const match=query.match(/(?:预算|低于|不超过|最多)?\s*(\d+)\s*(?:元|块)(?:以内|以下)?/);const cap=match?Number(match[1]):300;const items=/无结果/.test(query)?[]:products.filter(p=>p.price<=cap);if(!items.length)return{mode:'empty',items:[],answer:`这 3 款演示背包中，暂时没有商品价符合${cap}元预算的款式。你可以放宽预算，或者把这次需求留到后续再选。`};return{mode:'backpack',items,answer:items.length===3?defaultAnswer:`按你这次的预算，演示目录里有 ${items.length} 款背包符合商品价条件。${items.map(p=>p.name.split(' ')[0]).join('、')} 可以继续看看；到手价仍需结合目的地与规格确认。`};}
    async function startRun(query){query=query.trim();if(!query){queryInput.focus();toast('先告诉我，你想寻找什么好物。');return;}const plan=scenario(query);if(plan.compare){if(state.compare.size<2){state.compare=new Set(state.productIds.slice(0,3));render();}openCompare();queryInput.value='';return;}if(state.running)stopRun();const controller=new AbortController();abortController=controller;const signal=controller.signal;state.view='shopping';state.newSession=false;state.query=query;state.mode=plan.mode;state.compare.clear();queryInput.value='';const runId=makeId('run'),messageId=makeId('msg'),toolCallId=makeId('tool');emit({type:'RUN_STARTED',threadId:state.threadId,runId});window.scrollTo({top:0,behavior:'smooth'});
      try{
        emit({type:'STATE_SNAPSHOT',snapshot:{mode:plan.mode,productIds:[],stage:'正在整理用途与预算'}});emit({type:'STEP_STARTED',stepName:'正在整理用途与预算'});await pause(600,signal);emit({type:'STEP_FINISHED',stepName:'整理用途与预算'});
        emit({type:'STEP_STARTED',stepName:'正在查找演示目录中的合适商品'});emit({type:'TOOL_CALL_START',toolCallId,toolCallName:'demo_product_search'});emit({type:'TOOL_CALL_ARGS',toolCallId,delta:JSON.stringify({query,dataset:'three_backpacks_demo'})});await pause(850,signal);emit({type:'TOOL_CALL_END',toolCallId});emit({type:'TOOL_CALL_RESULT',messageId:makeId('tool_result'),toolCallId,content:JSON.stringify({productIds:plan.items.map(p=>p.id),demo:true}),role:'tool'});emit({type:'STEP_FINISHED',stepName:'查找演示商品'});
        emit({type:'STEP_STARTED',stepName:'正在整理适合你的选择'});emit({type:'TEXT_MESSAGE_START',messageId,role:'assistant'});for(let i=0;i<plan.answer.length;i+=4){await pause(36,signal);emit({type:'TEXT_MESSAGE_CONTENT',messageId,delta:plan.answer.slice(i,i+4)});}emit({type:'TEXT_MESSAGE_END',messageId});
        for(let index=0;index<plan.items.length;index++){await pause(260,signal);emit({type:'STATE_DELTA',delta:[{op:'replace',path:'/productIds',value:plan.items.slice(0,index+1).map(p=>p.id)}]});}emit({type:'STEP_FINISHED',stepName:'整理选购建议'});emit({type:'RUN_FINISHED',threadId:state.threadId,runId});
      }catch(error){if(error.name!=='AbortError'){emit({type:'RUN_ERROR',message:'本地交互演示未完成，请重新尝试。',code:'DEMO_ERROR'});}}
    }
    document.getElementById('composer').addEventListener('submit',event=>{event.preventDefault();state.running?stopRun():startRun(queryInput.value);});queryInput.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();state.running?stopRun():startRun(queryInput.value);}});
    document.addEventListener('change',event=>{if(event.target.matches('[data-compare]'))updateCompare(event.target.dataset.compare);});
    document.addEventListener('click',event=>{const target=event.target.closest('button,a');if(event.target.dataset.overlay){closeModal();return;}if(!target)return;if(target.tagName==='A')event.preventDefault();if(target.dataset.view){navigate(target.dataset.view);return;}if(target.dataset.detail){openDetail(target.dataset.detail);return;}if(target.dataset.favorite){updateFavorite(target.dataset.favorite);return;}if(target.dataset.prompt){startRun(target.dataset.prompt);return;}if(target.dataset.drawerCompare){state.compare.add(target.dataset.drawerCompare);closeModal();render();toast('已加入比较，可以再挑一件。');return;}switch(target.dataset.action){case'new':if(state.running)stopRun();state.view='shopping';state.newSession=true;state.threadId=makeId('thread');state.compare.clear();render();queryInput.value='';queryInput.focus();window.scrollTo({top:0,behavior:'smooth'});break;case'restore':restore();break;case'compare-hint':toast('勾选商品卡下方的“加入比较”，即可并排查看。');break;case'open-compare':openCompare();break;case'clear-compare':state.compare.clear();render();break;case'close-modal':closeModal();break;case'debug':openDebug();break;}if(target.id==='brand')restore();});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&modalRoot.children.length){closeModal();return;}if(event.key==='Tab'&&modalRoot.children.length){const focusable=[...modalRoot.querySelectorAll('button:not([disabled]),[href],input,select,textarea,[tabindex="0"]')];const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
    state.events.push({type:'STATE_SNAPSHOT',timestamp:Date.now(),snapshot:{mode:'backpack',productIds:products.map(p=>p.id),source:'local_initial_demo'}});render();
  </script>
</body>
